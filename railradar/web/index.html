<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RailRadar España</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>
<aside id="panel">
  <header>
    <h1>RailRadar <span>España</span></h1>
    <div id="conn" class="pill off">Conectando…</div>
  </header>
  <section class="kpis">
    <div><b id="k-visible">—</b><small>trenes con GPS</small></div>
    <div><b id="k-sources">—</b><small>fuentes activas</small></div>
    <div><b>120 s</b><small>antigüedad máx.</small></div>
  </section>
  <section>
    <h2>Frescura del GPS</h2>
    <div class="legend">
      <span><i style="background:var(--fresh)"></i>0–30 s</span>
      <span><i style="background:var(--mid)"></i>30–90 s</span>
      <span><i style="background:var(--old)"></i>90–120 s</span>
    </div>
    <label class="range">Mostrar hasta <output id="o-age">120</output> s
      <input id="f-age" type="range" min="15" max="120" step="5" value="120"></label>
  </section>
  <section>
    <h2>Fuentes</h2>
    <div id="f-sources"></div>
  </section>
  <section id="details" hidden>
    <h2>Tren <span id="d-id"></span></h2>
    <dl id="d-body"></dl>
  </section>
  <footer>Solo posiciones GPS reportadas por fuentes oficiales. Sin interpolación: si un tren no tiene posición de los últimos 120 s, no se muestra.</footer>
</aside>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
