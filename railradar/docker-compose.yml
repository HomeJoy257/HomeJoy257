services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 5 }

  collector:            # UNA sola instancia
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["python", "-m", "railradar.collector"]
    env_file: .env
    environment: { REDIS_URL: "redis://redis:6379/0" }
    depends_on: { redis: { condition: service_healthy } }
    restart: unless-stopped

  api:                  # escalable: docker compose up --scale api=3
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    environment: { REDIS_URL: "redis://redis:6379/0" }
    depends_on: { redis: { condition: service_healthy } }
    ports: ["8000:8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
