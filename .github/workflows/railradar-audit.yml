name: RailRadar · auditoría de datos reales Renfe

on:
  push:
    paths: ["railradar/audit/run.json"]     # editar este fichero lanza la auditoría
  workflow_dispatch:
    inputs:
      hours:
        description: "Horas totales de recogida (0.25 = prueba de 15 min)"
        default: "24"
      interval:
        description: "Segundos entre sondeos"
        default: "10"

permissions:
  contents: write

concurrency:
  group: railradar-audit
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.p.outputs.parts }}
      interval: ${{ steps.p.outputs.interval }}
      minutes: ${{ steps.p.outputs.minutes }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import math, json, os
          cfg = json.load(open("railradar/audit/run.json")) if not "${{ inputs.hours }}" else {}
          hours = float("${{ inputs.hours }}" or cfg.get("hours", 24))
          interval = int("${{ inputs.interval }}" or cfg.get("interval", 10))
          print(f"interval={interval}")
          total = hours * 60
          n = max(1, math.ceil(total / 340))          # trozos de <=340 min (límite job: 360)
          print("parts=" + json.dumps(list(range(1, n + 1))))
          print(f"minutes={total / n:.2f}")
          PY

  collect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      max-parallel: 1          # secuencial: cobertura continua
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Recoger datos (CKAN Renfe → feeds oficiales)
        run: |
          python3 railradar/audit/audit_feeds.py \
            --minutes ${{ needs.plan.outputs.minutes }} \
            --interval ${{ needs.plan.outputs.interval }} \
            --raw-every 30 \
            --out out/part-${{ matrix.part }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part-${{ matrix.part }}
          path: out/
          retention-days: 30

  analyze:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { path: art }
      - name: Vías de OpenStreetMap (railway=rail, España)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          curl -sSfL -o spain.osm.pbf https://download.geofabrik.de/europe/spain-latest.osm.pbf
          osmium tags-filter spain.osm.pbf w/railway=rail -o rails.osm.pbf
          osmium export rails.osm.pbf -o rails.geojson --geometry-types=linestring -a type
          ls -lh rails.geojson
        continue-on-error: true
      - name: Analizar
        run: |
          pip install -q numpy shapely pyproj
          DIRS=$(ls -d art/part-*/part-* | sort -V)
          RAILS=""; [ -s rails.geojson ] && RAILS="--rails rails.geojson"
          python3 railradar/audit/analyze_tracks.py $DIRS $RAILS --out analysis
          cat analysis/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar en rama railradar-data
        run: |
          RUN=run-$(date -u +%Y%m%dT%H%M)-${{ github.run_id }}
          mkdir -p pub/$RUN
          cp -r analysis pub/$RUN/
          for d in art/part-*/part-*; do
            p=$(basename "$d"); mkdir -p pub/$RUN/$p
            cp "$d/tracks.csv.gz" pub/$RUN/$p/ 2>/dev/null || true
            gzip -c "$d/samples.jsonl" > pub/$RUN/$p/samples.jsonl.gz 2>/dev/null || true
            cp "$d/feeds.json" "$d/report.md" pub/$RUN/$p/ 2>/dev/null || true
            cp -r "$d/raw_samples" pub/$RUN/$p/ 2>/dev/null || true
          done
          git config user.name "railradar-bot"
          git config user.email "railradar-bot@users.noreply.github.com"
          if git fetch origin railradar-data 2>/dev/null; then
            git checkout -q -B railradar-data origin/railradar-data
          else
            git checkout -q --orphan railradar-data && git rm -rqf . && git clean -fdxq -e pub -e art -e analysis
          fi
          cp -r pub/$RUN .
          git add $RUN
          git commit -qm "Datos reales Renfe: $RUN"
          for i in 1 2 3 4; do git push origin railradar-data && break || sleep $((2**i)); done
