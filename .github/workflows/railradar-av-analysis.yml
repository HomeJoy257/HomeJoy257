name: RailRadar · análisis alta velocidad
on:
  push:
    paths: ["railradar/audit/av_run.json"]
permissions:
  contents: write
concurrency: { group: railradar-av, cancel-in-progress: true }
jobs:
  av:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Datos de la auditoría
        run: |
          RUN=$(python3 -c "import json;print(json.load(open('railradar/audit/av_run.json'))['run'])")
          echo "RUN=$RUN" >> $GITHUB_ENV
          git fetch -q origin railradar-data
          mkdir -p data && git archive origin/railradar-data $RUN | tar -x -C data
      - name: Índice de productos (GTFS oficial Renfe)
        run: python3 railradar/probe/probe_gtfs.py gtfs_out
      - name: Vías OSM
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          curl -sSfL -o spain.osm.pbf https://download.geofabrik.de/europe/spain-latest.osm.pbf
          osmium tags-filter spain.osm.pbf w/railway=rail -o rails.osm.pbf
          osmium export rails.osm.pbf -o rails.geojson --geometry-types=linestring
      - name: Analizar alta velocidad
        working-directory: railradar/audit
        run: |
          pip install -q numpy shapely pyproj
          python3 av_analysis.py ../../data/$RUN --products ../../gtfs_out/products.csv --rails ../../rails.geojson --out ../../av_out
          cp ../../gtfs_out/products.csv ../../av_out/
      - name: Publicar
        run: |
          git config user.name "railradar-bot"; git config user.email "railradar-bot@users.noreply.github.com"
          mkdir -p /tmp/pub && cp -r av_out /tmp/pub/av
          git checkout -q -B railradar-data origin/railradar-data
          mkdir -p $RUN && rm -rf $RUN/av_analysis && cp -r /tmp/pub/av $RUN/av_analysis
          git add $RUN/av_analysis && git commit -qm "Análisis alta velocidad: $RUN"
          for i in 1 2 3 4; do git pull -q --rebase origin railradar-data; git push origin railradar-data && break || sleep $((2**i)); done
